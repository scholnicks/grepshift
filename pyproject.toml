[project]
name = "grepshift"
version = "1.5.2"
description = "Find and replace all instances of a string with a new string in a directory and all its sub-directories."
authors = [{ name = "Steve Scholnick", email = "scholnicks@gmail.com" }]
requires-python = ">=3.14"
readme = "README.md"
license = "MIT"
keywords = [
    "find",
    "replace",
    "string",
    "text",
    "batch",
    "bulk",
    "utility",
    "command-line",
    "cli",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = ["docopt-ng (>=0.9.0,<0.10.0)"]
license-files = ["LICENSE"]

[project.urls]
homepage = "https://pypi.org/project/grepshift/"
repository = "https://github.com/scholnicks/grepshift/"
Issues = "https://github.com/scholnicks/grepshift/issues"

[project.scripts]
grepshift = "grepshift.__main__:main"

[tool.hatch.build.targets.sdist]
include = ["src/grepshift"]

[tool.hatch.build.targets.wheel]
include = ["src/grepshift"]

[tool.hatch.build.targets.wheel.sources]
"src/grepshift" = "grepshift"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
